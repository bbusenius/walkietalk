[workspace]
resolver = "3"
members = ["crates/walkietalk", "crates/walkietalk-hermes-speech"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bbusenius/walkietalk"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
