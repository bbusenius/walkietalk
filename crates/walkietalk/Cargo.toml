[package]
name = "walkietalk"
description = "A Linux radio bridge for AI agents and messaging contacts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
cpal = "0.18"
crossterm = "0.29"
futures-util = "0.3"
hound = "3.5"
jiff = "0.2"
libc = "0.2"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "multipart", "form"] }
rubato = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10", default-features = false }
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
whisper-rs = "0.16"

[dev-dependencies]
axum = "0.8"

[lints]
workspace = true
