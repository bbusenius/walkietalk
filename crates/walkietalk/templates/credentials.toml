# Private Walkietalk credentials: variable name = value, one per line.
# Keep this file owner-only (chmod 600); symlinks are refused.
# Variables already exported in the environment take precedence.
# Config fields such as token_env and key_env name the variable to read here.
# Official CLI logins (Codex, Grok, Claude) stay in those CLIs' own stores, and
# a key here never selects a backend or enables a fallback.
# Uncomment only what your selected backends need.
# WALKIETALK_HERMES_TOKEN = "local Hermes service token"   # agent.hermes, tts.hermes
# XAI_API_KEY = "billed xAI API key"                       # grok-api STT/TTS, grok-realtime
# ANTHROPIC_API_KEY = "billed Anthropic API key"           # agent backend claude-api
