# Walkietalk settings. See the configuration reference in docs/CONFIGURATION.md.
# Sections for backends you do not select may be removed.

[agent]
backend = "stub"              # stub, hermes, codex, grok, claude, claude-api, or grok-realtime
max_reply_chars = 600
history_turns = 8
timeout_seconds = 60
web_search = true
instructions = ""             # empty uses built-in guidance; placeholders {max_reply_chars} {spoken_seconds} {max_words}

[agent.claude]
executable = "claude"
model = "claude-sonnet-5"
reasoning_effort = "low"

[agent.claude_api]
key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-5"
reasoning_effort = "low"

[agent.codex]
executable = "codex"
model = ""                    # empty uses the CLI default
reasoning_effort = "low"

[agent.grok]
executable = "grok"
model = "grok-4.7"
reasoning_effort = "low"

[agent.hermes]
url = "http://127.0.0.1:8642"
token_env = "WALKIETALK_HERMES_TOKEN"

[agent.realtime]
model = "grok-voice-latest"
voice = "eve"
key_env = "XAI_API_KEY"
url = "wss://api.x.ai/v1/realtime"
connect_timeout_seconds = 10
idle_timeout_seconds = 60

[audio]
# Exact names from `walkietalk devices`. Pick the radio interface itself.
input = "plughw:CARD=AllInOneCable,DEV=0"
output = "plughw:CARD=AllInOneCable,DEV=0"
gain = 1.0                    # above 1 amplifies and may clip

[listening]
mode = "conversation"         # conversation or wake-phrase
follow_up_seconds = 30        # unaddressed follow-ups accepted this long after a reply

# Messaging contacts are optional. Uncomment a section to enable it.
# [messaging]
# operator_mode = false       # hold every message for local review
#
# [messaging.signal]
# wake = "grandma"
# to = "+15557654321"
# account = ""                # local sending number when several are registered
#
# [messaging.whatsapp]
# wake = "nana"
# aliases = []
# to = "+15551234567"
# sender_alias = ""           # spoken sender label; empty uses the wake phrase
# empty_queue_reply = ""
# send_as_voice = false
# transcribe_voice = false
# listening = { mode = "conversation", follow_up_seconds = 60 }

[ptt]
port = "/dev/serial/by-id/REPLACE-with-your-interface"
line = "dtr"                  # dtr keys the AIOC; the other line is held low

[radio]
max_tx_seconds = 10           # hard cap for one transmission
settle_seconds = 0.2          # key-up delay before audio
post_tx_mute_seconds = 2      # listening pause after unkey; 0 disables

[radio.station_id]
callsign = ""                 # your granted station ID; empty disables identification
mode = "end-of-reply"         # off, end-of-reply, or interval
method = "voice"              # voice or morse
interval_seconds = 900

[shutdown]                    # remote program shutdown, phrase plus code
enabled = false
phrase = "initiate self-destruct"
phrase_aliases = ["initiate self destruct"]
code = "alpha 7"
code_aliases = ["alpha seven"]
confirm_window_seconds = 30
armed_reply = "Self-destruct sequence armed. What is the code?"
confirmed_reply = "Self-destruct in five seconds."

[sleep]                       # optional; remove to disable
phrase = "go to sleep"
aliases = ["stop listening"]
confirmation = "Standing by."

[stt]
backend = "whisper"           # whisper (local), grok (saved Grok login), or grok-api (billed key)
model = "base"                # whisper: tiny, base, or small; download with `walkietalk models`
timeout_seconds = 30
max_response_bytes = 1048576  # cap on each remote response
api_key_env = "XAI_API_KEY"   # grok-api only

[tts]
backend = "piper"             # piper, grok (saved login), grok-api (billed key), or hermes
timeout_seconds = 30
peak_normalize = false

[tts.grok]
voice = "eve"
language = "en"
speed = 1.0                   # 0.7 to 1.5
key_env = "XAI_API_KEY"       # grok-api only

[tts.hermes]
url = "http://127.0.0.1:8643"
token_env = "WALKIETALK_HERMES_TOKEN"

[tts.piper]
executable = "piper"
model = "~/.local/share/walkietalk/piper/en_US-amy-medium.onnx"

[vad]
threshold = 0.02              # RMS level that starts speech; compare with the live meter
hangover_ms = 400             # silence that ends an utterance
max_utterance_seconds = 12

[wake]
name = "charlotte"
aliases = ["charlot", "sharlot"]
confirmation = ""             # spoken when the name arrives alone; empty stays silent
