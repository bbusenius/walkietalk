name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
      - name: Check installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/walkietalk-installed"
          "$RUNNER_TEMP/walkietalk-installed/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/walkietalk-installed/bin/python" scripts/check_installation.py
