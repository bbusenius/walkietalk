# Copy to config.local.yaml. Select exact names from `walkietalk devices`.
audio:
  input_device: "REPLACE with exact AIOC capture device name"
  output_device: "REPLACE with exact AIOC playback device name"
  gain: 1                  # >1 amplifies; peaks may clip and degrade sound quality
ptt:
  serial_port: "/dev/serial/by-id/REPLACE-with-your-AIOC"
  # AIOC default: key with DTR high and RTS low; idle with both low.
  line: "dtr"
radio:
  max_tx_seconds: 10
  settle_seconds: 0.2
  post_tx_mute_seconds: 2     # wait after unkey before listening; 0 disables
  callsign: ""                # your granted station ID; leave empty for no spoken ID
  callsign_mode: "end_of_reply"  # off, end_of_reply, or interval
  callsign_interval_seconds: 900
vad:
  energy_threshold: 0.02    # tune from logged RMS; 1.0 is full scale
  hangover_ms: 400
  max_utterance_seconds: 12
stt:
  backend: "faster-whisper" # grok (SuperGrok login) or grok_api (XAI_API_KEY)
  model: "base"             # tiny or base; faster-whisper only
  timeout_seconds: 30       # Grok: total deadline, including login refresh
  max_response_bytes: 1048576 # Grok: per-response limit (1 MiB); optional
listening:
  mode: "wake_phrase"       # or conversation
  conversation_timeout_seconds: 60
tts:
  hermes_url: "http://127.0.0.1:8643" # separate Hermes speech service; see docs/HERMES-TTS.md
  hermes_token_env: "WALKIETALK_HERMES_TOKEN" # service bearer token env var name
  backend: "piper"         # piper, grok (saved login), grok_api (billed key), or hermes
  piper_executable: "piper" # CLI from the environment running walkietalk, or an absolute path
  piper_model: "~/.cache/walkietalk/piper/en_US-amy-medium.onnx"
  timeout_seconds: 30       # synthesis deadline; independent of the hard transmit limit
  grok_voice: "eve"        # built-in or custom xAI voice ID
  grok_language: "en"
  grok_speed: 1.0           # 0.7 to 1.5; independent of playback gain
  grok_api_key_env: "XAI_API_KEY" # only used by tts.backend: grok_api
  normalize: "off"          # off keeps engine level; peak fills the WAV (then audio.gain still applies)
wake:
  primary: "charlotte"
  aliases: ["charlot", "sharlot"]
  confirmation_phrase: ""  # spoken when this phrase arrives with no traffic; empty stays silent
agent:
  backend: "stub"          # stub, hermes, codex, grok, claude, claude_api, or grok_realtime
  max_reply_chars: 600     # reject oversized replies; 1–2000 characters
  history_turns: 8         # completed traffic/reply pairs to retain; 1–32
  timeout_seconds: 60      # overall agent deadline; >0 to 300 seconds
  web_search: false        # true allows web lookup (text agents) or realtime session tools
  instructions: ""         # empty keeps the default guidance; {max_reply_chars}, {spoken_seconds}, {max_words}
  hermes_url: "http://127.0.0.1:8642" # API base URL without /v1; use reachable Docker IP if needed
  hermes_token_env: "WALKIETALK_HERMES_TOKEN" # environment variable name, never the token
  codex_executable: "codex" # executable name on PATH or absolute path; no shell arguments
  codex_model: ""           # empty = CLI default, or an explicit model ID
  grok_executable: "grok"   # executable name on PATH or absolute path; no shell arguments
  grok_model: "grok-4.6"    # first-party model from your Grok CLI catalog
  codex_reasoning_effort: "low" # default = model default; desktop config is ignored
  grok_reasoning_effort: "low"  # default = Grok profile/model default
  claude_executable: "claude" # official CLI; saved login; no API-key fallback
  claude_model: "claude-sonnet-5"
  claude_reasoning_effort: "low" # default = model default
  claude_api_key_env: "ANTHROPIC_API_KEY" # env NAME; separately billed Messages API
  claude_api_model: "claude-sonnet-5"
  claude_api_reasoning_effort: "low" # default omits effort; useful for models without it
  realtime:
    model: "grok-voice-latest"  # or grok-voice-think-fast-2.0
    voice: "eve"                # built-in or custom xAI voice ID
    api_key_env: "XAI_API_KEY"  # billed console key; never SuperGrok login
    websocket_url: "wss://api.x.ai/v1/realtime"
    connect_timeout_seconds: 10
    idle_timeout_seconds: 60    # wait for server events after connect/commit
shutdown:
  # Say phrase + code together, or phrase alone then code within the window.
  enabled: false
  phrase: ""
  phrase_aliases: []
  code: ""
  code_aliases: []
  confirmation_seconds: 30
  arm_confirmation_phrase: ""  # spoken when the phrase alone arms shutdown; requires talk --transmit
  confirmation_phrase: ""   # spoken on the radio after the code; requires talk --transmit
